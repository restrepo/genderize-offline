# Builds the compact name dictionary from WGND 2.0 on Harvard Dataverse and attaches it
# to a GitHub release of its own (tag wgnd-2.0-rN, not v*, so nothing goes to PyPI).
# After a run, put the printed SHA-256 and the tag in src/genderize_offline/dictionary.py.
name: Dictionary

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag for the dictionary, e.g. wgnd-2.0-r2"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # to create the dictionary release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - name: Download WGND 2.0 (CC0) from Harvard Dataverse
        run: curl -fsSL -o wgnd.csv "https://dataverse.harvard.edu/api/access/datafile/4750348?format=original"
      - name: Build the compact dictionary
        run: |
          genderize-offline build wgnd.csv wgnd2_compact.tsv.gz
          sha256sum wgnd.csv wgnd2_compact.tsv.gz | tee SHA256SUMS
      - name: Create the dictionary release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" wgnd2_compact.tsv.gz SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest=false --title "Name dictionary $TAG" \
            --notes "Compact table built from WGND 2.0 (Raffo 2021, doi:10.7910/DVN/MSEGSJ, CC0) by \`genderize-offline build\` at $GITHUB_SHA. SHA-256 in SHA256SUMS."
